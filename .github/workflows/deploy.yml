name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-live.ts
        env:
          # Hardcoded deploy URL: this site lives at katsugtgz.github.io/bara-karhutla.
          PREVIOUS_LIVE_URL: https://katsugtgz.github.io/bara-karhutla/data/live.json
      - run: npm test
      - run: npx -y react-doctor@latest --yes --no-telemetry --blocking error
      - run: BASE_PATH=/bara-karhutla/ npm run build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
